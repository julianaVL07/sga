      summary: Consultar disponibilidad desde el canal (CU-08)
      description: |
        Apartamentos libres para la estancia y el grupo, con las mismas reglas que CU-01, 10 por página
        (12.4). La consulta queda en la bitácora (7.8). Mapea a `RecibirReservaExternaUseCase.consultarDisponibilidad`.
      operationId: consultarDisponibilidadCanal
      parameters:
        - { name: entrada, in: query, required: true, schema: { type: string, format: date }, example: '2026-11-20' }
        - { name: salida, in: query, required: true, schema: { type: string, format: date }, example: '2026-11-22' }
        - { name: ocupantes, in: query, required: true, schema: { type: integer, minimum: 1 }, example: 2 }
        - $ref: '#/components/parameters/PaginaApartamentos'
      responses:
        '200':
          description: Página de apartamentos disponibles (el contenido puede venir vacío)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamentoResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/canales/{canal}/reservas:
    parameters:
      - $ref: '#/components/parameters/Canal'
    post:
      tags: [ Canal externo ]
      summary: Recibir una reserva del canal (CU-08)
      description: |
        Si las noches están libres crea la reserva PENDIENTE con su folio (incluye CU-03). Si ya están
        vendidas o bloqueadas responde RECHAZADO_CONFLICTO (RN-18); si el identificador externo ya llegó,
        DUPLICADO_IGNORADO (RN-19). Todo mensaje queda en la bitácora (7.8), también los rechazados.
        Mapea a `RecibirReservaExternaUseCase.ejecutar`.
      operationId: recibirReservaExterna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaExternaRequest'
            example:
              identificadorExterno: BK-889201
              identificacionApartamento: APT-101
              fechaEntrada: '2026-11-20'
              fechaSalida: '2026-11-22'
              titular:
                nombre: Ana Gómez
                tipoDocumento: CC
                numeroDocumento: '1094000111'
                email: ana@example.com
                telefono: '3001234567'
              ocupantes:
                - nombre: Ana Gómez
                  tipoDocumento: CC
                  numeroDocumento: '1094000111'
                  fechaNacimiento: '1990-05-20'
      responses:
        '201':
          description: ACEPTADO, la reserva nace PENDIENTE con su folio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoCanalResponse'
        '200':
          description: DUPLICADO_IGNORADO, el mensaje ya había llegado (RN-19)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoCanalResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: RECHAZADO_CONFLICTO, las noches ya están vendidas o bloqueadas (RN-18)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoCanalResponse'
        '422':
          description: RECHAZADO_INVALIDO, los datos no cumplen las reglas de la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoCanalResponse'


  /api/canales/{canal}/reservas/{identificadorExterno}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Canal'
      - name: identificadorExterno
        in: path
        required: true
        description: Identificador de la reserva en el canal
        schema:
          type: string
          example: BK-889201
    put:
      tags: [ Canal externo ]
      summary: Cancelar una reserva del canal (CU-08)
      description: |
        Cancela la reserva que el mismo canal creó con ese identificador; una cancelación repetida responde
        DUPLICADO_IGNORADO (RN-19). Mapea a `RecibirReservaExternaUseCase.cancelar`.
      operationId: cancelarReservaExterna
      responses:
        '200':
          description: ACEPTADO o DUPLICADO_IGNORADO (RN-19)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoCanalResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: RECHAZADO_INVALIDO, no hay una reserva del canal con ese identificador o ya no se puede cancelar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoCanalResponse'

  # ==================== CU-22 a CU-25: ADMINISTRACIÓN Y TARIFAS (7.3, 7.4) ====================
  # POST /api/apartamentos (CU-22) y PUT /api/apartamentos/{id} (CU-23) están en sus rutas de arriba.

  /api/apartamentos/{id}/tarifas:
    parameters:
      - $ref: '#/components/parameters/IdApartamento'
    put:
      tags: [Apartamentos]
      summary: Definir tarifas por temporada (CU-24)
      description: |
        Una o varias tarifas por ocupante facturable y por noche que rigen desde hoy. La tarifa anterior de
        cada temporada no se pierde: queda en el histórico con la fecha desde la que estuvo vigente y la fecha
        en que se reemplazó (7.4). La cotización y las reservas siguen usando solo la tarifa vigente (RN-05).
        Si una tarifa no cumple, no se aplica ninguna. Un apartamento retirado de la venta responde 404.
        Mapea a `TarifasApartamentoUseCase.definir`.
      operationId: definirTarifasApartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinirTarifasRequest'
      responses:
        '200':
          description: Tarifas definidas; el detalle trae las vigentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o fue retirado de la venta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La temporada no existe en el alojamiento, está repetida o el valor no es mayor que cero (7.4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{id}/tarifas/historico:
    parameters:
      - $ref: '#/components/parameters/IdApartamento'
    get:
      tags: [Apartamentos]
      summary: Consultar el histórico de tarifas (CU-24)
      description: |
        Tarifas vigentes (vigenteHasta null) y reemplazadas, de la más reciente a la más antigua,
        10 por página (7.4, 12.4). Solo consulta. Mapea a `TarifasApartamentoUseCase.historico`.
      operationId: historicoTarifasApartamento
      parameters:
        - $ref: '#/components/parameters/PaginaApartamentos'
      responses:
        '200':
          description: Página del histórico (el contenido puede venir vacío)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaRegistroTarifaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe o fue retirado de la venta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/apartamentos/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/IdApartamento'
    put:
      tags: [Apartamentos]
      summary: Activar un apartamento (CU-25)
      description: |
        Pone el apartamento a la venta. Exige tarifa en todas las temporadas del alojamiento (7.4);
        uno retirado de la venta no puede activarse (7.3). Mapea a `ActivarApartamentoUseCase`.
      operationId: activarApartamento
      responses:
        '200':
          description: Apartamento activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Le falta tarifa en alguna temporada (7.4) o fue retirado de la venta (7.3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== CU-26 Y CU-27: VISTA DE RECEPCIÓN (7.1) ====================

  /api/reservas/llegadas:
    get:
      tags: [Reservas]
      summary: Llegadas previstas del día (CU-26)
      description: |
        Reservas CONFIRMADA cuya fecha de entrada es la fecha pedida (7.1, 7.6), ordenadas por apartamento,
        10 por página (12.4). Sin fecha se usa hoy en la zona horaria del alojamiento
        (`sga.alojamiento.zona-horaria`). Mapea a `ListarLlegadasYSalidasUseCase.llegadas`.
      operationId: listarLlegadasPrevistas
      parameters:
        - { name: fecha, in: query, required: false, description: Por defecto hoy en America/Bogota, schema: { type: string, format: date }, example: '2026-11-14' }
        - $ref: '#/components/parameters/PaginaApartamentos'
      responses:
        '200':
          description: Página de llegadas (puede venir vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumen'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Roles: RECEPCIONISTA o ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/salidas:
    get:
      tags: [Reservas]
      summary: Salidas previstas del día (CU-26)
      description: |
        Reservas EN_CURSO cuya fecha de salida es la fecha pedida (7.1, 7.6), ordenadas por apartamento,
        10 por página (12.4). Sin fecha se usa hoy en la zona horaria del alojamiento
        (`sga.alojamiento.zona-horaria`). Mapea a `ListarLlegadasYSalidasUseCase.salidas`.
      operationId: listarSalidasPrevistas
      parameters:
        - { name: fecha, in: query, required: false, description: Por defecto hoy en America/Bogota, schema: { type: string, format: date }, example: '2026-11-04' }
        - $ref: '#/components/parameters/PaginaApartamentos'
      responses:
        '200':
          description: Página de salidas (puede venir vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumen'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Roles: RECEPCIONISTA o ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/calendario:
    get:
      tags: [Operación en recepción]
      summary: Calendario de ocupación de un apartamento (CU-27)
      description: |
        Estado de cada noche entre desde (incluida) y hasta (excluida), como la estancia (3.1): LIBRE,
        RESERVADA (reserva activa PENDIENTE, CONFIRMADA o EN_CURSO, RN-12; trae su código y estado) o
        BLOQUEADA (bloqueo vigente, RN-07; trae el motivo). Las reservas canceladas, finalizadas o no-show
        no retienen la noche y no aparecen.

        Decisión del equipo: máximo 62 noches por consulta (dos meses completos, suficiente para la vista
        mensual de recepción con el mes siguiente). Mapea a `ConsultarCalendarioOcupacionUseCase` y
        `CalendarioOcupacionService`.
      operationId: consultarCalendarioOcupacion
      parameters:
        - { name: apartamento, in: query, required: true, schema: { type: string }, example: APT-201 }
        - { name: desde, in: query, required: true, description: Primera noche que se muestra, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, required: true, description: Primera noche que ya no se muestra (excluida), schema: { type: string, format: date }, example: '2026-11-08' }
      responses:
        '200':
          description: Calendario noche por noche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarioOcupacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Roles: RECEPCIONISTA o ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La fecha desde no es anterior a hasta o el rango supera 62 noches (7.1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== CU-28 A CU-30: CONFIGURACIÓN DEL ALOJAMIENTO (administrador) ====================

  /api/alojamiento:
    get:
      tags: [Configuración del alojamiento]
      summary: Consultar el alojamiento (CU-28)
      description: |
        Datos, ubicación, horario, normas de convivencia, servicios adicionales (L-17) y parámetros vigentes
        de la sección 6. Los parámetros son de solo lectura: se configuran en application.properties
        (`sga.alojamiento.*`) y no se cambian por API. Mapea a `ConfiguracionAlojamientoUseCase.consultar`.
      operationId: consultarAlojamiento
      security: []
      responses:
        '200':
          description: El alojamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
    put:
      tags: [Configuración del alojamiento]
      summary: Actualizar los datos del alojamiento (CU-28)
      description: |
        Reemplaza nombre, descripción, ciudad, dirección, ubicación y normas de convivencia con
        `Alojamiento.actualizarDatos`. El horario es opcional: si llegan las horas se aplica con
        `Alojamiento.definirHorario` (L-12); si no llega ninguna se conserva el vigente. Los parámetros de
        la sección 6 no cambian. Mapea a `ConfiguracionAlojamientoUseCase.actualizar`.
      operationId: actualizarAlojamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarAlojamientoRequest'
      responses:
        '200':
          description: Alojamiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Coordenada fuera de rango (7.3) o llega solo una de las dos horas del horario (L-12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/temporadas:
    get:
      tags: [Configuración del alojamiento]
      summary: Listar temporadas (CU-29)
      description: |
        Temporadas del alojamiento con sus rangos de fechas (fecha final excluida, nota de A.3), en el orden
        en que se registraron, 10 por página (12.4). La base no tiene rangos: cubre las fechas que no son de
        otra temporada (F-05). Mapea a `TemporadasUseCase.listar`.
      operationId: listarTemporadas
      security: []
      parameters:
        - $ref: '#/components/parameters/PaginaApartamentos'
      responses:
        '200':
          description: Página de temporadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTemporadaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
    post:
      tags: [Configuración del alojamiento]
      summary: Crear una temporada con las tarifas de los apartamentos activos (CU-29)
      description: |
        Regla 7.4: todo apartamento activo debe tener tarifa en todas las temporadas, por eso la temporada
        nueva trae la tarifa de cada apartamento activo. `CreacionTemporadaService` crea la temporada y asigna
        las tarifas en una sola operación: si falta alguna, no se crea la temporada ni se asigna ninguna
        tarifa. Cada tarifa queda en el histórico del apartamento desde hoy (`Apartamento.definirTarifa`,
        CU-24). Que no se solape con otra temporada ni sea una segunda base lo valida
        `Alojamiento.agregarTemporada` (7.4, F-05). Mapea a `TemporadasUseCase.crear`.
      operationId: crearTemporada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTemporadaRequest'
      responses:
        '201':
          description: Temporada creada
          headers:
            Location:
              description: URL de la temporada, por ejemplo /api/temporadas/T-FESTIVAL
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Falta la tarifa de un apartamento activo, un apartamento no existe o está repetido, un valor no es
            mayor que cero, una temporada no base no tiene rangos, se solapa con otra (7.4) o ya hay una
            temporada base (F-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/temporadas/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Id de la temporada, schema: { type: string }, example: T-ALTA }
    get:
      tags: [Configuración del alojamiento]
      summary: Consultar una temporada (CU-29)
      description: |
        La temporada con sus rangos de fechas (fecha final excluida). Es el recurso al que apunta la cabecera
        Location al crearla o al agregarle un rango. Mapea a `TemporadasUseCase.consultar`.
      operationId: consultarTemporada
      security: []
      responses:
        '200':
          description: La temporada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/temporadas/{id}/rangos:
    parameters:
      - { name: id, in: path, required: true, description: Id de la temporada, schema: { type: string }, example: T-MEDIA }
    post:
      tags: [Configuración del alojamiento]
      summary: Agregar un rango a una temporada (CU-29)
      description: |
        El rango (fecha final excluida) no puede solaparse con otra temporada (`Alojamiento.agregarRangoATemporada`)
        ni con los rangos de la misma; la temporada base no tiene rangos (`Temporada.agregarRango`, 7.4, F-05).
        Mapea a `TemporadasUseCase.agregarRango`.
      operationId: agregarRangoTemporada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RangoFechasRequest'
      responses:
        '201':
          description: Rango agregado; devuelve la temporada con todos sus rangos
          headers:
            Location:
              description: URL de la temporada, por ejemplo /api/temporadas/T-FESTIVAL
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El rango se solapa, la fecha fin no es posterior a la de inicio o la temporada es la base (7.4, F-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/politica-cancelacion:
    get:
      tags: [Configuración del alojamiento]
      summary: Consultar la política de cancelación vigente (CU-30)
      description: |
        La única versión vigente (7.4, F-07), la de mayor número: es la que se congela en cada reserva nueva
        (RN-22). Al arrancar, si no hay ninguna, se guarda la versión 1 con `sga.politica-cancelacion.*`.
        Mapea a `PoliticaCancelacionUseCase.vigente`.
      operationId: consultarPoliticaCancelacionVigente
      security: []
      responses:
        '200':
          description: La versión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
    put:
      tags: [Configuración del alojamiento]
      summary: Actualizar la política de cancelación (CU-30)
      description: |
        Crea la versión N+1 con los tramos y la consecuencia del no-show dados, vigente desde hoy. La versión
        anterior se conserva sin cambios y las reservas existentes siguen con la versión que congelaron al
        crearse (RN-22). L-10 lo valida el dominio. Mapea a `PoliticaCancelacionUseCase.actualizar` y
        `PoliticaCancelacionService.actualizar`.
      operationId: actualizarPoliticaCancelacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPoliticaCancelacionRequest'
      responses:
        '200':
          description: Nueva versión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Menos de dos tramos, dos tramos con la misma antelación, ningún tramo desde 0 días, antelación
            negativa o porcentaje fuera de 0 a 100 (L-10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/politica-cancelacion/versiones:
    get:
      tags: [Configuración del alojamiento]
      summary: Listar las versiones de la política de cancelación (CU-30)
      description: |
        Todas las versiones, de la más reciente a la más antigua, 10 por página (F-07, 12.4).
        Mapea a `PoliticaCancelacionUseCase.versiones`.
      operationId: listarVersionesPoliticaCancelacion
      parameters:
        - $ref: '#/components/parameters/PaginaApartamentos'
      responses:
        '200':
          description: Página de versiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPoliticaCancelacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== FOLIO: CARGOS Y CORRECCIONES (7.1, RN-16) ====================

  /api/reservas/{codigo}/folio/cargos:
    parameters:
      - $ref: '#/components/parameters/CodigoReserva'
    post:
      tags: [ Folio ]
      summary: Registrar el cargo de un servicio adicional (7.1)
      description: |
        Asienta en el folio el cargo de un servicio adicional del alojamiento (L-17), con el nombre y el valor del
        servicio y la fecha de hoy. El cargo lo genera `ServicioAdicional.generarCargoPara`: el servicio debe existir
        en el alojamiento, estar activo y generar cargo, y el folio debe estar abierto. El cargo no se edita ni se
        borra; se corrige con un movimiento inverso (RN-16). Mapea a `RegistrarCargoServicioUseCase`.
      operationId: registrarCargoServicio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarCargoServicioRequest'
            example:
              idServicio: SRV-CENA-BALCON
      responses:
        '201':
          description: Cargo registrado; devuelve el folio con el nuevo saldo
          headers:
            Location:
              description: URL del folio de la reserva, por ejemplo /api/reservas/RES-2026-00001/folio
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Roles: RECEPCIONISTA o ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El alojamiento no ofrece el servicio, no está activo o no genera cargo (L-17), o el folio está cerrado
            (RN-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservas/{codigo}/folio/correcciones:
    parameters:
      - $ref: '#/components/parameters/CodigoReserva'
    post:
      tags: [ Folio ]
      summary: Registrar una corrección (RN-16)
      description: |
        Toda corrección es un movimiento inverso: el cargo original no se edita ni se borra, y
        `Folio.registrarMovimientoInverso` asienta un cargo del mismo tipo con el valor opuesto, el motivo y la fecha
        de hoy. El cargo se identifica por su posición en la lista `cargos` de `FolioResponse`, contando desde 0
        (en un folio nuevo, 0 es el alojamiento y 1 el depósito de garantía). Mapea a
        `RegistrarCorreccionFolioUseCase`.
      operationId: registrarCorreccionFolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarCorreccionRequest'
            example:
              indiceCargo: 2
              motivo: La cena no se consumió
      responses:
        '201':
          description: Corrección registrada; devuelve el folio con el saldo corregido
          headers:
            Location:
              description: URL del folio de la reserva, por ejemplo /api/reservas/RES-2026-00001/folio
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Roles: RECEPCIONISTA o ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: No hay un cargo en esa posición o el folio está cerrado (RN-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== AUTENTICACIÓN (Guía 12) ====================

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Valida correo y contraseña (BCrypt) y devuelve un JWT HS256 para usar como `Authorization: Bearer <token>`.
        El token trae `sub` (correo), `documento` y `roles`, y vence en `sga.jwt.expiracion-minutos` (30).
        Ante cualquier error de credenciales o un usuario inactivo responde el mismo mensaje genérico.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              correo: recepcion@sga.local
              contrasena: Recepcion2026
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          description: Credenciales inválidas o usuario inactivo (mensaje "Credenciales inválidas")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar un huésped
      description: |
        Registro público. Siempre crea usuarios con rol HUESPED: los roles internos solo los asigna el
        administrador (`POST /api/usuarios`).
      operationId: registrarHuesped
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuarioRequest'
      responses:
        '201':
          description: Usuario registrado con rol HUESPED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRegistradoResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '409':
          description: El correo o el documento ya están registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/recuperacion/solicitar:
    post:
      tags: [Autenticación]
      summary: Pedir un código para restablecer la contraseña
      description: |
        7.2. Si el correo es de una cuenta activa, genera un código de 6 dígitos, lo guarda cifrado y lo envía por
        el puerto de notificaciones (con `sga.notificaciones.proveedor=local` queda en el log). El código vence a los
        `sga.recuperacion.vigencia` (15 minutos), sirve una sola vez y se anula tras
        `sga.recuperacion.intentos-maximos` (5) intentos fallidos. Pedir otro anula el anterior.

        Responde **202 exista o no la cuenta**, para no revelar qué correos están registrados. El correo sale
        después de responder: si falla, se registra en el log y la respuesta no cambia.
      operationId: solicitarRecuperacionContrasena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRecuperacionRequest'
            example:
              correo: huesped1@sga.local
      responses:
        '202':
          description: Solicitud recibida (no dice si el correo existe)
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /api/auth/recuperacion/restablecer:
    post:
      tags: [Autenticación]
      summary: Restablecer la contraseña con el código
      description: |
        7.2. Cambia la contraseña si el código coincide, no ha vencido y no se ha usado. La contraseña nueva sigue la
        regla del registro (8 a 72 caracteres, al menos una mayúscula y un número). Si el código no sirve (incorrecto,
        vencido, usado, sin intentos o el correo no tiene cuenta activa) responde 400 con el mismo mensaje en todos los
        casos.
      operationId: restablecerContrasena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
            example:
              correo: huesped1@sga.local
              codigo: '048213'
              nuevaContrasena: Huesped2027
      responses:
        '204':
          description: Contraseña restablecida; ya se puede iniciar sesión con la nueva
        '400':
          description: |
            Datos inválidos (con `errores` por campo) o el código no sirve
            (mensaje "El código no es válido o ya venció. Solicita uno nuevo.")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== USUARIOS (Guía 12, 7.2) ====================

  /api/usuarios:
    post:
      tags: [Usuarios]
      summary: Crear un usuario
      description: |
        El administrador crea un usuario de cualquier rol: aquí se asignan los roles internos. Mismas
        validaciones del registro, más el rol. Nunca responde con la contraseña.
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              description: URL del usuario, por ejemplo /api/usuarios/6
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El correo o el documento ya están registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: Usuarios ordenados por id, 10 por página (12.4). Los filtros son opcionales; la numeración empieza en 0.
      operationId: listarUsuarios
      parameters:
        - { name: rol, in: query, required: false, schema: { $ref: '#/components/schemas/RolUsuario' } }
        - { name: activo, in: query, required: false, schema: { type: boolean } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Página de usuarios (puede venir vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usuarios/me:
    get:
      tags: [Usuarios]
      summary: Consultar mi perfil
      description: Devuelve el usuario del token (claim `sub`). Nadie consulta el perfil de otro por esta ruta.
      operationId: consultarMiPerfil
      responses:
        '200':
          description: Usuario del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Cualquier usuario autenticado (HUESPED, RECEPCIONISTA, ADMINISTRADOR o PERSONAL_SERVICIO), sobre su propio usuario'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Usuarios]
      summary: Actualizar mi perfil
      description: |
        Actualiza solo nombre, teléfono y foto del usuario del token. El correo no es editable: si el cuerpo lo
        trae, se ignora.
      operationId: actualizarMiPerfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Cualquier usuario autenticado (HUESPED, RECEPCIONISTA, ADMINISTRADOR o PERSONAL_SERVICIO), sobre su propio usuario'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usuarios/me/contrasena:
    put:
      tags: [Usuarios]
      summary: Cambiar mi contraseña
      description: La contraseña nueva sigue la regla del registro. Si la actual no coincide responde 400.
      operationId: cambiarMiContrasena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioContrasenaRequest'
      responses:
        '204':
          description: Contraseña cambiada
        '400':
          description: Contraseña nueva inválida o contraseña actual incorrecta ("La contraseña actual no es correcta")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Cualquier usuario autenticado (HUESPED, RECEPCIONISTA, ADMINISTRADOR o PERSONAL_SERVICIO), sobre su propio usuario'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdUsuario'
    get:
      tags: [Usuarios]
      summary: Consultar un usuario
      operationId: consultarUsuario
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/usuarios/{id}/rol:
    parameters:
      - $ref: '#/components/parameters/IdUsuario'
    put:
      tags: [Usuarios]
      summary: Cambiar el rol de un usuario
      operationId: cambiarRolUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioRolRequest'
      responses:
        '200':
          description: Rol cambiado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/usuarios/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/IdUsuario'
    put:
      tags: [Usuarios]
      summary: Desactivar un usuario
      description: |
        Eliminación lógica (`activo = false`): el usuario deja de iniciar sesión (401), pero no se borran el
        titular ni sus reservas. No hay DELETE.
      operationId: desactivarUsuario
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Es titular de reservas PENDIENTE, CONFIRMADA o EN_CURSO, o el administrador intenta desactivarse a sí mismo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== REPORTES (administrador, 7.9) ====================

  /api/reportes/ocupacion:
    get:
      tags: [Reportes]
      summary: Reporte de ocupación (7.9)
      description: |
        Noches vendidas en el periodo y porcentaje = noches vendidas / (apartamentos activos × noches del periodo),
        con el detalle por apartamento. desde y hasta van incluidas: cada fecha es una noche.

        Una noche está vendida si pertenece a una reserva CONFIRMADA, EN_CURSO o FINALIZADA; de una estancia que
        empieza antes o termina después del periodo solo cuentan las noches de adentro. Los apartamentos activos
        son los que hoy están a la venta; uno retirado que vendió noches sale en el detalle con `activo: false`.
        Mapea a `ConsultarReportesUseCase.ocupacion` y `ReportesService`.
      operationId: reporteOcupacion
      parameters:
        - $ref: '#/components/parameters/DesdeReporte'
        - $ref: '#/components/parameters/HastaReporte'
      responses:
        '200':
          description: Reporte de ocupación del periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteOcupacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/PeriodoInvertido'

  /api/reportes/ingresos:
    get:
      tags: [Reportes]
      summary: Reporte de ingresos (7.9)
      description: |
        Suma de los pagos registrados en los folios con fecha entre desde y hasta (incluidas), por medio de pago.
        Los cargos no cuentan: son lo que se cobra, no lo que entró. Trae una fila por cada medio de pago, aunque
        esté en cero. Mapea a `ConsultarReportesUseCase.ingresos` y `ReportesService`; los folios se leen con
        `FolioRepository.listarConPagosEntre`.
      operationId: reporteIngresos
      parameters:
        - $ref: '#/components/parameters/DesdeReporte'
        - $ref: '#/components/parameters/HastaReporte'
      responses:
        '200':
          description: Reporte de ingresos del periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteIngresosResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/PeriodoInvertido'

  /api/reportes/reservas-por-canal:
    get:
      tags: [Reportes]
      summary: Reporte de reservas por canal (7.9)
      description: |
        Reservas con fecha de entrada entre desde y hasta (incluidas) por canal de origen, en cualquier estado:
        incluye las canceladas y los no-show. Trae una fila por cada canal (PORTAL, DIRECTO, EXTERNO), aunque
        esté en cero. Mapea a `ConsultarReportesUseCase.reservasPorCanal` y `ReportesService`.
      operationId: reporteReservasPorCanal
      parameters:
        - $ref: '#/components/parameters/DesdeReporte'
        - $ref: '#/components/parameters/HastaReporte'
      responses:
        '200':
          description: Reporte de reservas por canal del periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteReservasPorCanalResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: 'Sin permiso. Solo ADMINISTRADOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/PeriodoInvertido'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de POST /api/auth/login. Firmado con HS256, emisor sga, vence en 30 minutos.

  parameters:
    CodigoReserva:
      name: codigo
      in: path
      required: true
      description: Código de la reserva con formato RES-YYYY-NNNNN
      schema:
        type: string
        pattern: '^RES-\d{4}-\d{5}$'
        example: RES-2026-00001
    IdApartamento:
      name: id
      in: path
      required: true
      description: Identificación del apartamento
      schema:
        type: string
        example: APT-101
    PaginaApartamentos:
      name: pagina
      in: query
      required: false
      description: Número de página, empieza en 0 (10 resultados por página, 12.4)
      schema: { type: integer, minimum: 0, default: 0 }
    IdUsuario:
      name: id
      in: path
      required: true
      description: Id del usuario
      schema:
        type: integer
        format: int64
        example: 2
    Canal:
      name: canal
      in: path
      required: true
      description: Nombre de la plataforma externa que llama; para el dominio es el canal EXTERNO
      schema:
        type: string
        example: booking
    DesdeReporte:
      name: desde
      in: query
      required: true
      description: Primer día del periodo (incluido)
      schema: { type: string, format: date }
      example: '2026-11-01'
    HastaReporte:
      name: hasta
      in: query
      required: true
      description: Último día del periodo (incluido); no puede ser anterior a desde
      schema: { type: string, format: date }
      example: '2026-11-30'

  responses:
    DatosInvalidos:
      description: El mensaje está mal escrito (validación, JSON, fecha o enum inválidos)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: El identificador no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReglaDeNegocio:
      description: Una regla del negocio (RN/RP) lo impide; el mensaje empieza por el código de la regla
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PeriodoInvertido:
      description: La fecha desde es posterior a la fecha hasta (7.9)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-08T14:00:00Z'
            status: 409
            error: Conflict
            mensaje: '7.9: la fecha desde (2026-11-30) no puede ser posterior a la fecha hasta (2026-11-01)'
            path: /api/reportes/ocupacion

    NoAutenticado:
      description: Sin token, token mal firmado o vencido. Trae el encabezado WWW-Authenticate Bearer
      headers:
        WWW-Authenticate:
          description: Siempre empieza por Bearer
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-08T14:00:00Z'
            status: 401
            error: Unauthorized
            mensaje: Debe iniciar sesión o el token no es válido
            path: /api/reservas

  schemas:
    # ---------- Apartamentos y operación ----------

    EstadoOperativo:
      type: string
      enum: [ PREPARADO, OCUPADO, PENDIENTE_PREPARACION, EN_PREPARACION, FUERA_DE_SERVICIO ]

    GravedadNovedad:
      type: string
      enum: [ BAJA, MEDIA, ALTA ]

    CotizarEstanciaRequest:
      type: object
      required: [ identificacionApartamento, fechaEntrada, fechaSalida, ocupantes ]
      properties:
        identificacionApartamento: { type: string, example: APT-101 }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        ocupantes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OcupanteRequest' }

    RegistrarBloqueoRequest:
      type: object
      required: [ fechaInicio, fechaFin, motivo ]
      properties:
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date, description: Primera noche que ya no queda bloqueada }
        motivo: { type: string }

    RegistrarNovedadRequest:
      type: object
      required: [ autor, descripcion, gravedad ]
      properties:
        autor: { type: string }
        descripcion: { type: string }
        gravedad: { $ref: '#/components/schemas/GravedadNovedad' }

    ApartamentoResponse:
      type: object
      properties:
        identificacion: { type: string, example: APT-101 }
        nombre: { type: string }
        descripcion: { type: string }
        dormitorios: { type: integer }
        capacidadMaxima: { type: integer }
        dotacion: { type: array, items: { type: string } }
        imagenes: { type: array, items: { type: string } }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }

    PaginaApartamentoResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ApartamentoResponse' }
        pagina: { type: integer, example: 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64, example: 5 }
        totalPaginas: { type: integer, example: 1 }

    PaginaNovedadResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NovedadResponse' }
        pagina: { type: integer, example: 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64, example: 1 }
        totalPaginas: { type: integer, example: 1 }

    ApartamentoDisponibleResponse:
      type: object
      description: Tarjeta del resultado de la búsqueda (7.5)
      properties:
        identificacion: { type: string, example: APT-301 }
        nombre: { type: string, example: Gran Coral Imperial }
        imagenPrincipal: { type: string }
        capacidadMaxima: { type: integer, example: 6 }
        valorEstimado: { type: integer, format: int64, description: Valor de toda la estancia en pesos, example: 1000000 }
        latitud: { type: number, format: double, description: Del alojamiento, example: 10.3975 }
        longitud: { type: number, format: double, description: Del alojamiento, example: -75.559 }

    PaginaApartamentoDisponibleResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ApartamentoDisponibleResponse' }
        pagina: { type: integer, example: 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }

    ApartamentoDetalleResponse:
      type: object
      properties:
        identificacion: { type: string, example: APT-301 }
        nombre: { type: string }
        descripcion: { type: string }
        dormitorios: { type: integer }
        capacidadMaxima: { type: integer }
        dotacion: { type: array, items: { type: string } }
        imagenes:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              principal: { type: boolean }
        imagenPrincipal: { type: string }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        activo: { type: boolean }
        eliminado: { type: boolean, description: Eliminación lógica (12.4) }
        tarifas:
          type: array
          description: Valor por ocupante facturable y por noche en cada temporada (7.4)
          items:
            type: object
            properties:
              idTemporada: { type: string, example: T-BASE }
              valorPorOcupante: { type: integer, format: int64, example: 250000 }
        bloqueosVigentes:
          type: array
          items: { $ref: '#/components/schemas/BloqueoResponse' }

    DetalleNocheResponse:
      type: object
      properties:
        fecha: { type: string, format: date }
        temporada: { type: string, example: Base }
        tarifaAplicada: { type: integer, format: int64, description: Pesos por ocupante facturable }
        ocupantesFacturables: { type: integer }
        subtotal: { type: integer, format: int64 }

    CotizacionResponse:
      type: object
      properties:
        identificacionApartamento: { type: string }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        noches: { type: integer }
        detalles:
          type: array
          items: { $ref: '#/components/schemas/DetalleNocheResponse' }
        valorTotal: { type: integer, format: int64 }

    BloqueoResponse:
      type: object
      properties:
        id: { type: string }
        identificacionApartamento: { type: string }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        motivo: { type: string }
        vigente: { type: boolean }

    NovedadResponse:
      type: object
      properties:
        id: { type: string }
        identificacionApartamento: { type: string }
        fecha: { type: string, format: date }
        autor: { type: string }
        descripcion: { type: string }
        gravedad: { $ref: '#/components/schemas/GravedadNovedad' }
        fechaAtencion: { type: string, format: date, nullable: true }

    SugerirGravedadRequest:
      type: object
      required: [ descripcion ]
      properties:
        descripcion: { type: string, maxLength: 1000, example: Huele a gas en la cocina }

    SugerenciaGravedadResponse:
      type: object
      description: Sugerencia de la IA (10.2). Si disponible es false, gravedad y explicacion vienen en null
      properties:
        disponible: { type: boolean }
        gravedad:
          oneOf:
            - $ref: '#/components/schemas/GravedadNovedad'
            - type: 'null'
        explicacion: { type: [ string, 'null' ], maxLength: 200 }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 409 }
        error: { type: string, example: Conflict }
        mensaje: { type: string, example: 'RN-09: la reserva debe tener hora estimada de llegada' }
        path: { type: string, example: /api/reservas/RES-2026-00001/confirmar }
        errores:
          type: object
          description: Campo → mensaje; solo en los 400 de validación
          additionalProperties: { type: string }

    CanalOrigen:
      type: string
      enum: [PORTAL, DIRECTO, EXTERNO]

    EstadoReserva:
      type: string
      enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]

    TitularRequest:
      type: object
      required: [nombre, tipoDocumento, numeroDocumento, email, telefono]
      properties:
        nombre: { type: string }
        tipoDocumento: { type: string, example: CC }
        numeroDocumento: { type: string }
        email: { type: string, format: email }
        telefono: { type: string }

    OcupanteRequest:
      type: object
      required: [nombre, fechaNacimiento]
      properties:
        nombre: { type: string }
        tipoDocumento: { type: string, description: Opcional }
        numeroDocumento: { type: string, description: Opcional }
        fechaNacimiento: { type: string, format: date }

    CrearReservaRequest:
      type: object
      required: [identificacionApartamento, fechaEntrada, fechaSalida, canalOrigen, titular, ocupantes]
      properties:
        identificacionApartamento: { type: string, example: APT-101 }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        horaEstimadaLlegada: { type: string, example: '16:30', description: Opcional al crear; obligatoria para confirmar (RN-09) }
        canalOrigen: { $ref: '#/components/schemas/CanalOrigen' }
        titular: { $ref: '#/components/schemas/TitularRequest' }
        ocupantes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OcupanteRequest' }
        cantidadMascotas: { type: integer, minimum: 0, example: 1, description: Opcional; sin dato = 0. Máximo 2 lo valida el dominio (L-16) }
        pesoMascotaMasPesadaKg: { type: integer, minimum: 0, example: 8, description: Opcional; sin dato = 0. Hasta 10 kg lo valida el dominio (L-16) }

    ModificarReservaRequest:
      type: object
      description: Todos los campos son opcionales; el que viene en null se conserva
      properties:
        identificacionApartamento: { type: string }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        ocupantes:
          type: array
          items: { $ref: '#/components/schemas/OcupanteRequest' }
        cantidadMascotas: { type: integer, minimum: 0, description: L-16; con 0 se quitan las mascotas }
        pesoMascotaMasPesadaKg: { type: integer, minimum: 0, description: L-16 }

    ConfirmarReservaRequest:
      type: object
      properties:
        horaEstimadaLlegada: { type: string, example: '21:00' }

    CancelarReservaRequest:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string }

    TitularResponse:
      type: object
      properties:
        nombre: { type: string }
        tipoDocumento: { type: string }
        numeroDocumento: { type: string }
        email: { type: string }
        telefono: { type: string }

    OcupanteResponse:
      type: object
      properties:
        nombre: { type: string }
        tipoDocumento: { type: string, nullable: true }
        numeroDocumento: { type: string, nullable: true }
        fechaNacimiento: { type: string, format: date }

    ReservaDetalleResponse:
      type: object
      properties:
        codigo: { type: string, example: RES-2026-00001 }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        canalOrigen: { $ref: '#/components/schemas/CanalOrigen' }
        identificacionApartamento: { type: string, example: APT-101 }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        noches: { type: integer }
        horaEstimadaLlegada: { type: string, nullable: true }
        titular: { $ref: '#/components/schemas/TitularResponse' }
        ocupantes:
          type: array
          items: { $ref: '#/components/schemas/OcupanteResponse' }
        totalOcupantes: { type: integer }
        valorTotal: { type: integer, format: int64, description: Valor congelado en pesos (RN-22) }
        versionPoliticaCancelacion: { type: integer }
        cantidadMascotas: { type: integer, description: 0 si no trae mascotas (L-16) }
        pesoMascotaMasPesadaKg: { type: integer, description: 0 si no trae mascotas (L-16) }
        fechaCreacion: { type: string, format: date-time }
        fechaConfirmacion: { type: string, format: date-time, nullable: true }
        motivoCancelacion: { type: string, nullable: true }

    ModificacionReservaResponse:
      type: object
      properties:
        reserva: { $ref: '#/components/schemas/ReservaDetalleResponse' }
        diferencia: { type: integer, format: int64, description: En pesos; negativa si baja el valor }

    RetencionResponse:
      type: object
      properties:
        codigo: { type: string }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        retencion: { type: integer, format: int64, description: En pesos (RN-13) }

    ReservaResumenResponse:
      type: object
      properties:
        codigo: { type: string, example: RES-2026-00001 }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        apartamento: { type: string, example: APT-101 }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        nombreTitular: { type: string }
        totalOcupantes: { type: integer }
        canalOrigen: { $ref: '#/components/schemas/CanalOrigen' }
        valorTotal: { type: integer, format: int64, description: Valor congelado en pesos (RN-22) }

    PaginaReservaResumen:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ReservaResumenResponse' }
        pagina: { type: integer, description: Empieza en 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }

    # ---------- Folio y canal externo ----------

    MedioPago:
      type: string
      enum: [ TARJETA_DEBITO_CREDITO, TRANSFERENCIA_BANCARIA ]

    TipoCargo:
      type: string
      description: |
        Tipos de cargo del folio (7.7). AJUSTE_MODIFICACION es la diferencia de una modificación (RN-14) y también
        el depósito de garantía de RP-02 y su devolución (valor negativo), como lo definen el Anexo A y el glosario.
      enum: [ ALOJAMIENTO, SERVICIO_ADICIONAL, AJUSTE_MODIFICACION, PENALIDAD_CANCELACION_NOSHOW ]

    TipoEventoCanal:
      type: string
      enum: [ CONSULTA_DISPONIBILIDAD, CREACION_RESERVA, CANCELACION_RESERVA ]

    ResultadoEventoCanal:
      type: string
      enum: [ ACEPTADO, RECHAZADO_CONFLICTO, RECHAZADO_INVALIDO, DUPLICADO_IGNORADO ]

    RegistrarPagoRequest:
      type: object
      required: [ valor, medio ]
      properties:
        valor: { type: integer, format: int64, minimum: 1, description: Pesos enteros }
        medio: { $ref: '#/components/schemas/MedioPago' }

    AutorizarCierreFolioRequest:
      type: object
      required: [ autorizadoPor, motivo ]
      properties:
        autorizadoPor: { type: string }
        motivo: { type: string }

    ReservaExternaRequest:
      type: object
      required: [ identificadorExterno, identificacionApartamento, fechaEntrada, fechaSalida, titular, ocupantes ]
      properties:
        identificadorExterno: { type: string, example: BK-889201 }
        identificacionApartamento: { type: string, example: APT-101 }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        horaEstimadaLlegada: { type: string, nullable: true, example: '16:30:00' }
        titular: { $ref: '#/components/schemas/TitularRequest' }
        ocupantes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OcupanteRequest' }

    CargoResponse:
      type: object
      properties:
        tipo: { $ref: '#/components/schemas/TipoCargo' }
        concepto: { type: string }
        valor: { type: integer, format: int64, description: Negativo si es un ajuste a la baja o un movimiento inverso }
        fecha: { type: string, format: date }

    PagoResponse:
      type: object
      properties:
        valor: { type: integer, format: int64 }
        medio: { $ref: '#/components/schemas/MedioPago' }
        fecha: { type: string, format: date }

    FolioResponse:
      type: object
      properties:
        codigoReserva: { type: string, example: RES-2026-00001 }
        fechaApertura: { type: string, format: date }
        depositoGarantia: { type: integer, format: int64, example: 250000 }
        cargos:
          type: array
          items: { $ref: '#/components/schemas/CargoResponse' }
        pagos:
          type: array
          items: { $ref: '#/components/schemas/PagoResponse' }
        totalCargos: { type: integer, format: int64 }
        totalPagado: { type: integer, format: int64 }
        saldo: { type: integer, format: int64, description: Cargos menos pagos; negativo si hay saldo a favor }
        cerrado: { type: boolean }
        fechaCierre: { type: string, format: date, nullable: true }
        autorizadoPor: { type: string, nullable: true }
        motivoAutorizacion: { type: string, nullable: true }

    EventoCanalResponse:
      type: object
      properties:
        identificadorExterno: { type: string }
        tipoEvento: { $ref: '#/components/schemas/TipoEventoCanal' }
        resultado: { $ref: '#/components/schemas/ResultadoEventoCanal' }

    # ---------- CU-22 a CU-25: administración y tarifas (7.3, 7.4) ----------

    ImagenRequest:
      type: object
      required: [ url ]
      properties:
        url: { type: string, example: 'https://coral.co/img/apt-401-sala.jpg', description: 'Debe empezar por http:// o https://' }
        principal: { type: boolean, default: false, description: Exactamente una imagen debe ser la principal }

    TarifaRequest:
      type: object
      required: [ idTemporada, valorPorOcupante ]
      properties:
        idTemporada: { type: string, example: T-BASE, description: Debe existir en el alojamiento (7.4) }
        valorPorOcupante: { type: integer, format: int64, example: 300000, description: Pesos por ocupante facturable y por noche; mayor que cero (7.4) }

    RegistrarApartamentoRequest:
      type: object
      required: [ identificacion, nombre, dormitorios, capacidadMaxima, dotacion, imagenes ]
      properties:
        identificacion: { type: string, example: APT-401, description: Única en el alojamiento (L-04) }
        nombre: { type: string, example: Coral Esmeralda }
        descripcion: { type: string, nullable: true }
        dormitorios: { type: integer, example: 1, description: Al menos 1 }
        capacidadMaxima: { type: integer, example: 3, description: Al menos 1 (RN-02) }
        dotacion:
          type: array
          description: Al menos un elemento (L-06)
          items: { type: string }
        imagenes:
          type: array
          description: Entre 1 y 10, exactamente una principal (7.3)
          items: { $ref: '#/components/schemas/ImagenRequest' }
        tarifas:
          type: array
          nullable: true
          description: Opcional; sin tarifa en todas las temporadas el apartamento no puede activarse (7.4)
          items: { $ref: '#/components/schemas/TarifaRequest' }

    ActualizarApartamentoRequest:
      type: object
      required: [ nombre, dormitorios, capacidadMaxima, dotacion ]
      properties:
        nombre: { type: string, example: Coral Esmeralda Renovado }
        descripcion: { type: string, nullable: true }
        dormitorios: { type: integer, example: 2 }
        capacidadMaxima: { type: integer, example: 2, description: No modifica las reservas ya creadas (7.3) }
        dotacion:
          type: array
          items: { type: string }

    DefinirTarifasRequest:
      type: object
      required: [ tarifas ]
      properties:
        tarifas:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TarifaRequest' }

    ActualizacionApartamentoResponse:
      type: object
      properties:
        apartamento: { $ref: '#/components/schemas/ApartamentoDetalleResponse' }
        reservasSobreCapacidad:
          type: array
          description: Códigos de reservas activas o futuras cuyo grupo supera la nueva capacidad (7.3)
          items: { type: string, example: RES-2026-00007 }
        advertencia:
          type: string
          nullable: true
          description: Presente solo si hay reservas afectadas; empieza por 7.3

    RegistroTarifaResponse:
      type: object
      properties:
        idTemporada: { type: string, example: T-BASE }
        valorPorOcupante: { type: integer, format: int64, example: 300000 }
        vigenteDesde: { type: string, format: date, nullable: true, description: Null solo para tarifas cargadas sin fecha (datos iniciales) }
        vigenteHasta: { type: string, format: date, nullable: true, description: Fecha en que se reemplazó; null si rige hoy }
        vigente: { type: boolean }

    PaginaRegistroTarifaResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/RegistroTarifaResponse' }
        pagina: { type: integer, description: Empieza en 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }

    # ---------- CU-27 Calendario de ocupación ----------

    EstadoNoche:
      type: string
      enum: [ LIBRE, RESERVADA, BLOQUEADA ]

    NocheCalendarioResponse:
      type: object
      properties:
        fecha: { type: string, format: date, description: La noche va de esta fecha a la siguiente (3.1) }
        estado: { $ref: '#/components/schemas/EstadoNoche' }
        codigoReserva: { type: string, nullable: true, example: RES-2026-00003, description: Solo si está RESERVADA }
        estadoReserva:
          nullable: true
          description: Solo si está RESERVADA (PENDIENTE, CONFIRMADA o EN_CURSO)
          allOf: [ { $ref: '#/components/schemas/EstadoReserva' } ]
        motivoBloqueo: { type: string, nullable: true, example: Mantenimiento de la piscina de inmersión, description: Solo si está BLOQUEADA }

    CalendarioOcupacionResponse:
      type: object
      properties:
        apartamento: { type: string, example: APT-201 }
        desde: { type: string, format: date }
        hasta: { type: string, format: date, description: Excluida }
        noches:
          type: array
          maxItems: 62
          description: Una entrada por noche, en orden de fecha
          items: { $ref: '#/components/schemas/NocheCalendarioResponse' }

    # ---------- CU-28 Alojamiento ----------

    ActualizarAlojamientoRequest:
      type: object
      required: [nombre, ciudad, latitud, longitud]
      properties:
        nombre: { type: string, example: Coral }
        descripcion: { type: string, nullable: true }
        ciudad: { type: string, example: Cartagena de Indias }
        direccion: { type: string, nullable: true, example: 'Sector Bocagrande, Avenida del Malecón' }
        latitud: { type: number, format: double, minimum: -90, maximum: 90, example: 10.3975, description: Fuera de rango es 409 (7.3) }
        longitud: { type: number, format: double, minimum: -180, maximum: 180, example: -75.559, description: Fuera de rango es 409 (7.3) }
        normaConvivencia: { type: string, nullable: true }
        horaEntrada: { type: string, format: time, nullable: true, example: '15:00', description: Opcional; si llega una hora debe llegar también la otra (L-12) }
        horaSalida: { type: string, format: time, nullable: true, example: '11:00' }

    ServicioAdicionalResponse:
      type: object
      properties:
        id: { type: string, example: SRV-RECEPCION-NOCTURNA }
        nombre: { type: string, example: Recepción nocturna }
        descripcion: { type: string, nullable: true }
        generaCargo: { type: boolean }
        valor: { type: integer, format: int64, example: 70000, description: Pesos enteros; 0 si no genera cargo }
        activo: { type: boolean }

    ParametrosAlojamientoResponse:
      type: object
      description: Parámetros de la sección 6 vigentes (solo lectura, se configuran en application.properties)
      properties:
        umbralEdadFacturable: { type: integer, nullable: true, example: 6, description: L-09 }
        tiempoPreparacionHoras: { type: integer, nullable: true, example: 3, description: L-13 }
        plazoConfirmacionHoras: { type: integer, nullable: true, example: 12, description: L-14 }
        horaLimiteNoShow: { type: string, format: time, nullable: true, example: '22:00:00', description: L-15 }
        horaInicioLlegadaNocturna: { type: string, format: time, nullable: true, example: '20:00:00', description: RP-03 }
        estanciaMinimaNoches: { type: integer, nullable: true, example: 2, description: RP-01 }
        estanciaMinimaActiva: { type: boolean }
        exigeAnticipo: { type: boolean, description: L-11 }
        porcentajeAnticipo: { type: integer, example: 50 }
        aceptaMascotas: { type: boolean, description: L-16 }
        cargoAseoMascota: { type: integer, format: int64, example: 110000 }
        maximoMascotas: { type: integer, example: 2 }
        pesoMaximoMascotaKg: { type: integer, example: 10 }
        depositoGarantia: { type: integer, format: int64, example: 250000, description: 'RP-02: depósito de garantía reembolsable, el mismo que se asienta en el folio de toda reserva nueva' }

    AlojamientoResponse:
      type: object
      properties:
        id: { type: string, example: ALO-CORAL }
        nombre: { type: string, example: Coral }
        descripcion: { type: string, nullable: true }
        ciudad: { type: string, example: Cartagena de Indias }
        direccion: { type: string, nullable: true }
        latitud: { type: number, format: double, example: 10.3975 }
        longitud: { type: number, format: double, example: -75.559 }
        horaEntrada: { type: string, format: time, example: '15:00:00' }
        horaSalida: { type: string, format: time, example: '11:00:00' }
        normaConvivencia: { type: string, nullable: true }
        serviciosAdicionales:
          type: array
          items: { $ref: '#/components/schemas/ServicioAdicionalResponse' }
        parametros: { $ref: '#/components/schemas/ParametrosAlojamientoResponse' }

    # ---------- CU-29 Temporadas ----------

    TipoTemporada:
      type: string
      enum: [ BASE, MEDIA, ALTA ]

    RangoFechasRequest:
      type: object
      required: [fechaInicio, fechaFin]
      description: Fecha final excluida (nota de A.3)
      properties:
        fechaInicio: { type: string, format: date, example: '2027-03-01' }
        fechaFin: { type: string, format: date, example: '2027-03-11' }

    TarifaTemporadaRequest:
      type: object
      required: [identificacionApartamento, valorPorOcupante]
      properties:
        identificacionApartamento: { type: string, example: APT-101 }
        valorPorOcupante: { type: integer, format: int64, example: 450000, description: Pesos enteros por ocupante facturable y por noche; debe ser mayor que cero (409) }

    CrearTemporadaRequest:
      type: object
      required: [id, nombre, tipo]
      properties:
        id: { type: string, example: T-FESTIVAL }
        nombre: { type: string, example: Festival }
        tipo: { $ref: '#/components/schemas/TipoTemporada' }
        rangos:
          type: array
          description: Al menos uno si no es BASE; la base no lleva rangos (409, F-05)
          items: { $ref: '#/components/schemas/RangoFechasRequest' }
        tarifas:
          type: array
          description: Una por cada apartamento activo (7.4); puede incluir apartamentos inactivos no retirados
          items: { $ref: '#/components/schemas/TarifaTemporadaRequest' }

    RangoFechasResponse:
      type: object
      properties:
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date, description: Excluida }

    TemporadaResponse:
      type: object
      properties:
        id: { type: string, example: T-MEDIA }
        nombre: { type: string, example: Media }
        tipo: { $ref: '#/components/schemas/TipoTemporada' }
        rangos:
          type: array
          items: { $ref: '#/components/schemas/RangoFechasResponse' }

    PaginaTemporadaResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TemporadaResponse' }
        pagina: { type: integer, description: Empieza en 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }

    # ---------- CU-30 Política de cancelación ----------

    TramoCancelacionRequest:
      type: object
      required: [antelacionMinimaDias, porcentajeRetencion]
      properties:
        antelacionMinimaDias: { type: integer, example: 16, description: No negativa (409, L-10) }
        porcentajeRetencion: { type: integer, example: 0, description: Entre 0 y 100 (409, L-10) }

    ActualizarPoliticaCancelacionRequest:
      type: object
      required: [consecuenciaNoShow, tramos]
      properties:
        consecuenciaNoShow: { type: string, example: Se retiene el 60 % del valor total de la estancia }
        tramos:
          type: array
          description: Al menos dos, con antelaciones distintas y uno desde 0 días; si no, 409 (L-10)
          items: { $ref: '#/components/schemas/TramoCancelacionRequest' }

    TramoCancelacionResponse:
      type: object
      properties:
        antelacionMinimaDias: { type: integer, example: 16 }
        porcentajeRetencion: { type: integer, example: 0 }

    PoliticaCancelacionResponse:
      type: object
      properties:
        version: { type: integer, example: 1 }
        vigenteDesde: { type: string, format: date, example: '2026-01-01' }
        consecuenciaNoShow: { type: string }
        tramos:
          type: array
          description: De la mayor a la menor antelación
          items: { $ref: '#/components/schemas/TramoCancelacionResponse' }

    PaginaPoliticaCancelacionResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/PoliticaCancelacionResponse' }
        pagina: { type: integer, description: Empieza en 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }

    # ---------- Folio: cargos y correcciones (7.1, RN-16) ----------

    RegistrarCargoServicioRequest:
      type: object
      required: [ idServicio ]
      properties:
        idServicio: { type: string, example: SRV-CENA-BALCON, description: Id de un servicio adicional del alojamiento (L-17) }

    RegistrarCorreccionRequest:
      type: object
      required: [ indiceCargo, motivo ]
      properties:
        indiceCargo: { type: integer, example: 2, description: 'Posición del cargo en la lista cargos del folio, desde 0; si no existe, 409 (RN-16)' }
        motivo: { type: string, example: La cena no se consumió }

    # ---------- Seguridad y usuarios (Guía 12, 7.2) ----------

    RolUsuario:
      type: string
      enum: [ HUESPED, RECEPCIONISTA, ADMINISTRADOR, PERSONAL_SERVICIO ]

    LoginRequest:
      type: object
      required: [ correo, contrasena ]
      properties:
        correo: { type: string, format: email, example: recepcion@sga.local }
        contrasena: { type: string, example: Recepcion2026 }

    TokenResponse:
      type: object
      properties:
        token: { type: string, description: JWT firmado con HS256 }
        tipo: { type: string, example: Bearer }
        expiraEn: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RolUsuario' }

    RegistroUsuarioRequest:
      type: object
      required: [ nombre, correo, contrasena, telefono, documento, fechaNacimiento ]
      properties:
        nombre: { type: string, maxLength: 100, example: Laura Gómez }
        correo: { type: string, format: email, maxLength: 120, example: laura@correo.co }
        contrasena: { type: string, minLength: 8, maxLength: 72, description: Al menos una mayúscula y un número, example: Huesped2026 }
        telefono: { type: string, maxLength: 20, example: '3135550404' }
        documento: { type: string, maxLength: 15, example: '1094555666' }
        fechaNacimiento: { type: string, format: date, description: Debe ser pasada, example: '1995-01-30' }

    UsuarioRegistradoResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        correo: { type: string }
        rol: { $ref: '#/components/schemas/RolUsuario' }

    SolicitarRecuperacionRequest:
      type: object
      required: [ correo ]
      properties:
        correo: { type: string, format: email, maxLength: 120, example: huesped1@sga.local }

    RestablecerContrasenaRequest:
      type: object
      required: [ correo, codigo, nuevaContrasena ]
      properties:
        correo: { type: string, format: email, maxLength: 120, example: huesped1@sga.local }
        codigo: { type: string, pattern: '^\d{6}$', description: El código de 6 dígitos que llegó al correo, example: '048213' }
        nuevaContrasena: { type: string, minLength: 8, maxLength: 72, description: Al menos una mayúscula y un número, example: Huesped2027 }

    CrearUsuarioRequest:
      type: object
      description: Las validaciones del registro, más el rol
      required: [ nombre, correo, contrasena, telefono, documento, fechaNacimiento, rol ]
      properties:
        nombre: { type: string, maxLength: 100, example: Recepción Noche }
        correo: { type: string, format: email, maxLength: 120, example: recepcion2@sga.local }
        contrasena: { type: string, minLength: 8, maxLength: 72, description: Al menos una mayúscula y un número, example: Recepcion2026 }
        telefono: { type: string, maxLength: 20, example: '3001000009' }
        documento: { type: string, maxLength: 15, example: '1000000009' }
        fechaNacimiento: { type: string, format: date, description: Debe ser pasada, example: '1993-06-18' }
        rol: { $ref: '#/components/schemas/RolUsuario' }

    CambioRolRequest:
      type: object
      required: [ rol ]
      properties:
        rol: { $ref: '#/components/schemas/RolUsuario' }

    ActualizarPerfilRequest:
      type: object
      description: Solo estos campos son editables; el correo no
      required: [ nombre, telefono ]
      properties:
        nombre: { type: string, maxLength: 100, example: Laura Gómez }
        telefono: { type: string, maxLength: 20, example: '3135550404' }
        fotoUrl: { type: string, maxLength: 500, description: 'Opcional; debe empezar por http:// o https://', example: 'https://fotos.sga.local/laura.png' }

    CambioContrasenaRequest:
      type: object
      required: [ contrasenaActual, contrasenaNueva ]
      properties:
        contrasenaActual: { type: string, example: Huesped2026 }
        contrasenaNueva: { type: string, minLength: 8, maxLength: 72, description: Al menos una mayúscula y un número, example: Huesped2027 }

    UsuarioResponse:
      type: object
      description: Nunca incluye la contraseña
      properties:
        id: { type: integer, format: int64, example: 2 }
        nombre: { type: string, example: Recepcion Coral }
        correo: { type: string, example: recepcion@sga.local }
        telefono: { type: string, example: '3001000002' }
        documento: { type: string, example: '1000000002' }
        fechaNacimiento: { type: string, format: date }
        fotoUrl: { type: [ string, 'null' ] }
        rol: { $ref: '#/components/schemas/RolUsuario' }
        activo: { type: boolean }

    PaginaUsuarioResponse:
      type: object
      properties:
        contenido:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/UsuarioResponse' }
        pagina: { type: integer, description: Empieza en 0 }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }

    # ---------- Reportes (7.9) ----------

    ReporteOcupacionResponse:
      type: object
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date, description: Incluida }
        nochesPeriodo: { type: integer, example: 30 }
        apartamentosActivos: { type: integer, example: 5 }
        nochesDisponibles: { type: integer, description: apartamentosActivos × nochesPeriodo, example: 150 }
        nochesVendidas: { type: integer, example: 9 }
        porcentajeOcupacion: { type: number, description: 'nochesVendidas / nochesDisponibles × 100, dos decimales', example: 6.0 }
        apartamentos:
          type: array
          description: Ordenados por identificación
          items:
            type: object
            properties:
              apartamento: { type: string, example: APT-101 }
              nochesVendidas: { type: integer, example: 3 }
              porcentajeOcupacion: { type: number, description: 'nochesVendidas / nochesPeriodo × 100', example: 10.0 }
              activo: { type: boolean, description: false si hoy no está a la venta }

    ReporteIngresosResponse:
      type: object
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date, description: Incluida }
        total: { type: integer, format: int64, description: Pesos colombianos, example: 1950000 }
        cantidadPagos: { type: integer, example: 3 }
        medios:
          type: array
          description: Una fila por cada medio de pago, aunque esté en cero
          items:
            type: object
            properties:
              medio: { $ref: '#/components/schemas/MedioPago' }
              cantidadPagos: { type: integer }
              total: { type: integer, format: int64 }
              porcentaje: { type: number, description: Participación en el total, dos decimales }

    ReporteReservasPorCanalResponse:
      type: object
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date, description: Incluida }
        totalReservas: { type: integer, example: 7 }
        canales:
          type: array
          description: Una fila por canal (PORTAL, DIRECTO, EXTERNO), aunque esté en cero
          items:
            type: object
            properties:
              canal: { $ref: '#/components/schemas/CanalOrigen' }
              total: { type: integer }
              activas: { type: integer, description: PENDIENTE, CONFIRMADA o EN_CURSO }
              finalizadas: { type: integer }
              canceladas: { type: integer }
              noShow: { type: integer }
              porcentaje: { type: number, description: Participación del canal, dos decimales }
