        alojamiento y el depósito de garantía de RP-02 (tipo AJUSTE_MODIFICACION). Es el recurso al que apunta la
        cabecera Location de un pago registrado. Solo consulta. Mapea a `ConsultarFolioUseCase`.
      operationId: consultarFolio
