# ==========================================
# CONFIGURACIÓN DE SPRING BOOT Y BASE DE DATOS
# ==========================================
spring.application.name=sga

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA (Hibernate) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080

# --- OpenAPI / Swagger (Para documentar la API) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# PARÁMETROS DEL ALOJAMIENTO "CORAL" (ANEXO A)
# ==========================================
sga.alojamiento.zona-horaria=America/Bogota

# L-09: A partir de los 6 años se liquidan como ocupantes facturables
sga.alojamiento.umbral-edad-facturable=6

# L-12: Horas de entrada y salida
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00

# L-13: Ventana disponible de preparación (3 horas)
sga.alojamiento.tiempo-preparacion-horas=3

# L-14: Plazo de confirmación de reserva pendiente (12 horas)
sga.alojamiento.plazo-confirmacion-horas=12

# L-15: Hora límite para no-show
sga.alojamiento.hora-limite-no-show=22:00

# L-11: Exigencia del 50% de anticipo
sga.alojamiento.porcentaje-anticipo=50

# RP-02: Depósito de garantía por inventario ($250.000 COP)
sga.alojamiento.deposito-garantia=250000

# RP-03: Recargo por Llegada Nocturna a partir de las 20:00 (8:00 PM)
sga.alojamiento.hora-inicio-llegada-nocturna=20:00
sga.alojamiento.id-servicio-recepcion-nocturna=SRV-REC-NOCTURNA