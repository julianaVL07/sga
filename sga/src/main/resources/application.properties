spring.application.name=sga

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080

# --- Parametros del Apartahotel Coral (Anexo A). L-13: configuracion del alojamiento, nunca una constante ---
sga.alojamiento.zona-horaria=America/Bogota
sga.alojamiento.umbral-edad-facturable=6
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
sga.alojamiento.tiempo-preparacion-horas=3
sga.alojamiento.plazo-confirmacion-horas=12
sga.alojamiento.hora-limite-no-show=22:00
sga.alojamiento.hora-inicio-llegada-nocturna=20:00
sga.alojamiento.porcentaje-anticipo=50
# RP-02: deposito de garantia en pesos colombianos
sga.alojamiento.deposito-garantia=250000
# RP-02: concepto con el que se asienta el deposito en el folio
sga.alojamiento.deposito-garantia-concepto=Dep\u00f3sito de garant\u00eda por inventario y cristaler\u00eda fina
# RP-03: id del ServicioAdicional de recepcion nocturna ($70.000) que se carga en los datos iniciales
sga.alojamiento.id-servicio-recepcion-nocturna=SRV-RECEPCION-NOCTURNA
# RP-03: valor del cargo de recepcion nocturna en pesos colombianos
sga.alojamiento.valor-recepcion-nocturna=70000
# RP-01: noches minimas cuando la estancia incluye viernes o sabado en temporada media o alta
sga.alojamiento.estancia-minima-noches=2
sga.alojamiento.estancia-minima-activa=true
# L-11: el alojamiento exige anticipo (porcentaje en sga.alojamiento.porcentaje-anticipo) para confirmar
sga.alojamiento.exige-anticipo=true
# L-16: politica de mascotas. Maximo 2 mascotas de hasta 10 kg, cargo unico de aseo por estancia
sga.alojamiento.mascotas.aceptadas=true
sga.alojamiento.mascotas.cargo-aseo=110000
sga.alojamiento.mascotas.maximo=2
sga.alojamiento.mascotas.peso-maximo-kg=10

# --- Politica de cancelacion vigente (Anexo A, A.4) ---
# RN-22: version que se congela en cada reserva nueva. Para cambiarla se sube la version y la fecha
sga.politica-cancelacion.version=1
sga.politica-cancelacion.vigente-desde=2026-01-01
# 7.4: consecuencia del no-show
sga.politica-cancelacion.consecuencia-no-show=Se retiene el 50% del valor total de la estancia como penalidad; la reserva transita a NO_SHOW y se liberan de inmediato todas las noches en el inventario (RN-12, RN-13).
# L-10 y RN-13: tramos de retencion segun los dias de antelacion de la cancelacion.
# 16 dias o mas retiene 0 %, de 7 a 15 dias retiene 25 %, menos de 7 dias o no-show retiene 50 %
sga.politica-cancelacion.tramos[0].dias-antelacion=16
sga.politica-cancelacion.tramos[0].porcentaje-retencion=0
sga.politica-cancelacion.tramos[1].dias-antelacion=7
sga.politica-cancelacion.tramos[1].porcentaje-retencion=25
sga.politica-cancelacion.tramos[2].dias-antelacion=0
sga.politica-cancelacion.tramos[2].porcentaje-retencion=50

# --- Tareas programadas ---
# CU-14 (RN-21): cada cuanto se vencen las reservas pendientes sin confirmar (formato ISO-8601)
sga.tareas.vencimiento-pendientes.intervalo=PT15M
sga.tareas.vencimiento-pendientes.retraso-inicial=PT1M

# --- Paginacion ---
# 7.5, 12.4: 10 resultados por pagina en todos los listados
sga.paginacion.tamano=10

# --- Seguridad y JWT (Guia 12) ---
# La clave NO se escribe aqui (12.4). Se lee de application-secrets.properties (no versionado)
# o, en despliegue, de la variable de entorno SGA_JWT_SECRET.
spring.config.import=optional:classpath:application-secrets.properties
sga.jwt.emisor=sga
sga.jwt.expiracion-minutos=30

# --- CORS: origenes del frontend en desarrollo (Guia 12) ---
sga.cors.origenes-permitidos=http://localhost:5173,http://localhost:3000

